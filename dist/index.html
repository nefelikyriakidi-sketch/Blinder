<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff9f3">
    <meta name="description" content="Pick a place together. Swipe through brunch spots, lunch places, dinner picks, and bars with your group.">
    <title>Blinder</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <a class="wordmark" href="./" aria-label="Blinder home"><span class="logo" aria-hidden="true">b.</span> blinder</a>
        <span class="outing-chip" id="outing-chip" hidden></span>
        <button class="text-button" id="room-menu" type="button" hidden>Room</button>
        <button class="text-button" id="install" type="button" hidden>Install</button>
      </header>
      <main id="screen" tabindex="-1"></main>
      <noscript>Enable JavaScript to start a round.</noscript>
    </div>
    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-top">
        <h2 id="sheet-title"></h2>
        <form method="dialog"><button class="close" aria-label="Close">×</button></form>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <template id="home">
      <section class="home">
        <div class="preview-stack" aria-hidden="true">
          <div class="preview-left photo" style="--x:0%;--y:33.333%"></div>
          <div class="preview-right photo" style="--x:100%;--y:0%"></div>
          <div class="preview-front photo" style="--x:0%;--y:0%"><span>♥</span></div>
        </div>
        <span class="eyebrow">Sample deck</span>
        <h1>Pick a place<br> together.</h1>
        <p>From team lunches to drinks. Swipe with your group and see where you all agree.</p>
        <form id="join-form">
          <div class="form-fields">
            <div>
              <label for="nickname">Your nickname</label>
              <input id="nickname" name="name" autocomplete="nickname" maxlength="24" required placeholder="e.g. Alex">
            </div>
            <div id="outing-field">
              <label for="outing">Outing</label>
              <select id="outing" name="outing"></select>
            </div>
          </div>
          <button class="primary" id="join-submit" type="submit">Create a room <span aria-hidden="true">→</span></button>
        </form>
        <button class="secondary" id="try-demo" type="button">Try a solo demo</button>
      </section>
    </template>
  </body>
</html>
